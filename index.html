<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>QRコードリーダー</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #c7c7e2;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-top: 1em;
    }

    /* カメラ枠の縦幅を大きく変更 */
    #videoContainer {
      position: relative;
      width: 95%;
      max-width: 500px;
      margin: 1em auto 0;
      overflow: hidden;
      border: 2px solid #333;
      border-radius: 8px;
      background-color: #f5f5f5;
    }

    #video {
      width: 100%;
      height: 380px; /* 縦幅を拡大 */
      object-fit: cover; /* 映像の切り取りを自然に */
      display: block;
      transform-origin: center center;
      transition: transform 0.2s ease;
    }

    /* ズームボタンエリア */
    #zoomControls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .zoom-btn {
      margin-top: 0;
      padding: 0.5em 1.2em;
      font-size: 1em;
      border: 1px solid #333;
      border-radius: 6px;
      background-color: #ffffff;
      color: #333;
      font-weight: bold;
      cursor: pointer;
    }

    .zoom-btn.active {
      background-color: #0078d7;
      color: white;
      border-color: #005a9e;
    }

    #fileInput {
      margin-top: 1em;
    }

    #result {
      margin-top: 1em;
      font-size: 1.2em;
      color: #006400;
      word-break: break-word;
    }

    a {
      color: #0066cc;
      text-decoration: underline;
    }

    button {
      margin-top: 1em;
      padding: 0.5em 1em;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      background-color: #0078d7;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #005a9e;
    }
    
    #fileInput {
      margin-top: 1em;
      padding: 0.5em;
      font-size: 1em;
      background-color: #ccffff;
      border: 1px solid #999;
      border-radius: 6px;
      cursor: pointer;
    }

    #fileLabel {
      display: block;
      margin-top: 1em;
      font-size: 0.95em;
      color: #333;
    }
    
  </style>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>
  <h1>QRリーダー & 拡大鏡</h1>

  <div id="videoContainer">
    <video id="video" autoplay></video>
  </div>

  <!-- ズームコントロールボタン -->
  <div id="zoomControls">
    <button type="button" class="zoom-btn active" id="btnZoom1">1x</button>
    <button type="button" class="zoom-btn" id="btnZoom2">2x</button>
    <button type="button" class="zoom-btn" id="btnZoom4">4x</button>
  </div>

  <button id="startButton">カメラで読み取る</button><br>

  <label id="fileLabel" for="fileInput">画像ファイルを選択してください</label>
  <input type="file" id="fileInput" accept="image/*"><br>

  <div id="result">読み取り結果がここに表示されます</div>

  <script>
    const codeReader = new ZXing.BrowserQRCodeReader();
    const videoElement = document.getElementById('video');
    const resultElement = document.getElementById('result');
    const fileInput = document.getElementById('fileInput');
    const startButton = document.getElementById('startButton');

    const btnZoom1 = document.getElementById('btnZoom1');
    const btnZoom2 = document.getElementById('btnZoom2');
    const btnZoom4 = document.getElementById('btnZoom4');

    let currentZoom = 1;

    function displayResult(text) {
      // URLならリンク化、それ以外はそのまま表示
      const urlPattern = /^(https?:\/\/[^\s]+)/;
      if (urlPattern.test(text)) {
        resultElement.innerHTML = `<a href="${text}" target="_blank">${text}</a>`;
      } else {
        resultElement.textContent = text;
      }
    }

    // ズーム適用関数
    function applyZoom(zoomValue) {
      currentZoom = zoomValue;
      
      // ボタンの見た目を更新
      [btnZoom1, btnZoom2, btnZoom4].forEach(btn => btn.classList.remove('active'));
      if (zoomValue === 1) btnZoom1.classList.add('active');
      if (zoomValue === 2) btnZoom2.classList.add('active');
      if (zoomValue === 4) btnZoom4.classList.add('active');

      // 1. ハードウェアカメラズームの適用を試みる
      if (videoElement.srcObject) {
        const stream = videoElement.srcObject;
        const tracks = stream.getVideoTracks();
        if (tracks.length > 0) {
          const track = tracks[0];
          const capabilities = track.getCapabilities ? track.getCapabilities() : {};
          if (capabilities.zoom) {
            const min = capabilities.zoom.min || 1;
            const max = capabilities.zoom.max || 1;
            const targetZoom = Math.min(Math.max(zoomValue, min), max);
            track.applyConstraints({
              advanced: [{ zoom: targetZoom }]
            }).catch(err => console.log('Hardware zoom not supported:', err));
          }
        }
      }

      // 2. CSS表示拡大（フォールバックおよび補正用）
      videoElement.style.transform = `scale(${zoomValue})`;
    }

    btnZoom1.addEventListener('click', () => applyZoom(1));
    btnZoom2.addEventListener('click', () => applyZoom(2));
    btnZoom4.addEventListener('click', () => applyZoom(4));

    startButton.addEventListener('click', async () => {
      resultElement.textContent = ""; // 前回の結果をクリア

      try {
        await codeReader.reset(); // ← カメラを明示的にリセット
        await codeReader.decodeFromVideoDevice(null, videoElement, (result, err) => {
          if (result) {
            displayResult(result.getText());
          }
        });
        // カメラ起動後に現在のズーム設定を再適用
        applyZoom(currentZoom);
      } catch (error) {
        resultElement.textContent = "カメラの起動に失敗しました";
        console.error("Camera error:", error);
      }
    });

    // ファイル画像から読み取り
    fileInput.addEventListener('change', (e) => {
      resultElement.textContent = ""; // 前回の結果をクリア
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        codeReader.decodeFromImage(img).then(result => {
          displayResult(result.getText());
        }).catch(err => {
          resultElement.textContent = '読み取り失敗';
        });
      };
      img.src = URL.createObjectURL(file);
    });

  </script>

</body>
</html>
